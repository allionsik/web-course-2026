<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Волнистая рамка -->
        <svg class="frame-svg" viewBox="0 0 400 600" preserveAspectRatio="none">
            <path d="
                M 40 20
                Q 60 12, 80 20 Q 100 28, 120 20 Q 140 12, 160 20 Q 180 28, 200 20 Q 220 12, 240 20 Q 260 28, 280 20 Q 300 12, 320 20 Q 340 28, 360 20
                Q 380 28, 375 50
                Q 385 70, 375 90 Q 385 110, 375 130 Q 385 150, 375 170 Q 385 190, 375 210 Q 385 230, 375 250 Q 385 270, 375 290 Q 385 310, 375 330 Q 385 350, 375 370 Q 385 390, 375 410 Q 385 430, 375 450 Q 385 470, 375 490 Q 385 510, 375 530 Q 385 550, 375 570
                Q 360 580, 340 572 Q 320 564, 300 572 Q 280 580, 260 572 Q 240 564, 220 572 Q 200 580, 180 572 Q 160 564, 140 572 Q 120 580, 100 572 Q 80 564, 60 572 Q 40 580, 25 570
                Q 15 550, 25 530 Q 15 510, 25 490 Q 15 470, 25 450 Q 15 430, 25 410 Q 15 390, 25 370 Q 15 350, 25 330 Q 15 310, 25 290 Q 15 270, 25 250 Q 15 230, 25 210 Q 15 190, 25 170 Q 15 150, 25 130 Q 15 110, 25 90 Q 15 70, 25 50
                Q 20 28, 40 20 Z
            " fill="#9fa882"/>
        </svg>

        <!-- Белый лист -->
        <div class="paper">
            <svg class="paper-svg" viewBox="0 0 320 500" preserveAspectRatio="none">
                <path d="
                    M 30 15
                    Q 50 8, 70 15 Q 90 22, 110 15 Q 130 8, 150 15 Q 170 22, 190 15 Q 210 8, 230 15 Q 250 22, 270 15 Q 290 8, 300 15
                    Q 312 80, 305 160 Q 315 240, 305 320 Q 315 400, 300 485
                    Q 270 492, 250 485 Q 230 478, 210 485 Q 190 492, 170 485 Q 150 478, 130 485 Q 110 492, 90 485 Q 70 478, 50 485 Q 30 492, 20 485
                    Q 8 400, 15 320 Q 5 240, 15 160 Q 8 80, 30 15 Z
                " fill="#fcfbf7"/>
            </svg>

            <div class="paper-content">
                <h1>To do list</h1>

                <form class="todo-form" id="todo-form">
                    <input type="text" id="todo-input" class="todo-input" placeholder="Добавить новую задачу..." autocomplete="off">
                    <button type="submit" class="btn btn--add">Добавить</button>
                </form>

                <div class="filters" id="filters">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="active">Активные</button>
                    <button class="filter-btn" data-filter="completed">Готовые</button>
                </div>

                <ul class="todo-list" id="todo-list"></ul>

                <div class="counter" id="counter">Осталось: 0, Выполнено: 0</div>
            </div>
        </div>

        <!-- ===== ДЕКОРАЦИИ ===== -->

        <!-- Большая голубая бабочка (в левом верхнем углу) -->
        <svg class="decor bow-top-left" viewBox="0 0 200 200">
            <defs>
                <radialGradient id="bigUpper" cx="40%" cy="35%" r="80%">
                    <stop offset="0%"   stop-color="#f0f7ff"/>
                    <stop offset="25%"  stop-color="#c8ddf5"/>
                    <stop offset="60%"  stop-color="#a8c8f0"/>
                    <stop offset="88%"  stop-color="#7fa8d8"/>
                    <stop offset="100%" stop-color="#5c85b8"/>
                </radialGradient>
                <radialGradient id="bigLower" cx="45%" cy="40%" r="78%">
                    <stop offset="0%"   stop-color="#e3f0ff"/>
                    <stop offset="35%"  stop-color="#b8d4f5"/>
                    <stop offset="75%"  stop-color="#8ab0e0"/>
                    <stop offset="100%" stop-color="#6f9bd0"/>
                </radialGradient>
                <linearGradient id="bigBody" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%"   stop-color="#8ab0e0"/>
                    <stop offset="50%"  stop-color="#5c85b8"/>
                    <stop offset="100%" stop-color="#3a5a8b"/>
                </linearGradient>
                <filter id="bigShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="0" dy="3" stdDeviation="3"
                                  flood-color="#4a6a9b" flood-opacity="0.35"/>
                </filter>
                <filter id="bigBlur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="1.8"/>
                </filter>
            </defs>

            <g filter="url(#bigShadow)">
                <path d="M 96 100 C 70 60, 30 30, 12 48 C -8 68, 4 108, 40 118 C 60 124, 84 116, 96 100 Z"
                      fill="url(#bigUpper)"/>
                <path d="M 96 104 C 80 130, 50 160, 30 168 C 12 175, 8 158, 22 140 C 40 120, 76 108, 96 104 Z"
                      fill="url(#bigLower)"/>
                <path d="M 104 100 C 130 60, 170 30, 188 48 C 208 68, 196 108, 160 118 C 140 124, 116 116, 104 100 Z"
                      fill="url(#bigUpper)"/>
                <path d="M 104 104 C 120 130, 150 160, 170 168 C 188 175, 192 158, 178 140 C 160 120, 124 108, 104 104 Z"
                      fill="url(#bigLower)"/>

                <g filter="url(#bigBlur)" opacity="0.5">
                    <path d="M 96 100 C 76 72, 44 50, 24 58 C 12 64, 8 84, 14 100 C 40 88, 74 88, 96 100 Z"
                          fill="#6f9bd0"/>
                    <path d="M 104 100 C 124 72, 156 50, 176 58 C 188 64, 192 84, 186 100 C 160 88, 126 88, 104 100 Z"
                          fill="#6f9bd0"/>
                </g>

                <ellipse cx="52" cy="76" rx="12" ry="8" fill="#ffffff" opacity="0.6"
                         transform="rotate(-30 52 76)"/>
                <ellipse cx="148" cy="76" rx="12" ry="8" fill="#ffffff" opacity="0.6"
                         transform="rotate(30 148 76)"/>
                <ellipse cx="40" cy="68" rx="5" ry="3" fill="#ffffff" opacity="0.9"
                         transform="rotate(-30 40 68)"/>
                <ellipse cx="160" cy="68" rx="5" ry="3" fill="#ffffff" opacity="0.9"
                         transform="rotate(30 160 68)"/>
                <ellipse cx="58" cy="134" rx="9" ry="6" fill="#e3f0ff" opacity="0.7"
                         transform="rotate(-40 58 134)"/>
                <ellipse cx="142" cy="134" rx="9" ry="6" fill="#e3f0ff" opacity="0.7"
                         transform="rotate(40 142 134)"/>

                <ellipse cx="100" cy="150" rx="10" ry="4" fill="#4a6a9b"
                         opacity="0.35" filter="url(#bigBlur)"/>
                <path d="M 100 60 C 104 72, 106 90, 106 110 C 106 130, 104 145, 100 152
                         C 96 145, 94 130, 94 110 C 94 90, 96 72, 100 60 Z"
                      fill="url(#bigBody)"/>
                <circle cx="100" cy="58" r="5" fill="#5c85b8"/>
                <circle cx="100" cy="56" r="2" fill="#ffffff" opacity="0.7"/>
                <ellipse cx="98" cy="100" rx="2.5" ry="18" fill="#ffffff" opacity="0.45"/>

                <path d="M 98 54 Q 88 32, 76 22" fill="none"
                      stroke="#3a5a8b" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M 102 54 Q 112 32, 124 22" fill="none"
                      stroke="#3a5a8b" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="76" cy="22" r="2.2" fill="#3a5a8b"/>
                <circle cx="124" cy="22" r="2.2" fill="#3a5a8b"/>

                <path d="M 96 100 Q 80 106, 66 112" fill="none"
                      stroke="#5c85b8" stroke-width="1" opacity="0.5"/>
                <path d="M 104 100 Q 120 106, 134 112" fill="none"
                      stroke="#5c85b8" stroke-width="1" opacity="0.5"/>
            </g>
        </svg>

        <!-- Ромашки -->

                <ellipse cx="11.5" cy="11.5" rx="4" ry="7" transform="rotate(-45 11.5 11.5)"/>

        <!-- Фиолетовая бабочка (слева внизу) -->

            <defs>
