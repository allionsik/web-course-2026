<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка - Выбор режима</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- ЭКРАН ВЫБОРА РЕЖИМА -->
        <div id="modeSelection" class="overlay">
            <h2>Выберите режим</h2>
            <div class="mode-buttons">
                <button id="btnWinter" class="mode-btn winter-btn">❄️ Зима</button>
                <button id="btnNight" class="mode-btn night-btn">🌙 Ночь</button>
            </div>
        </div>

        <!-- ИГРОВОЙ ЭКРАН -->
        <div class="hud">
            <span>Счёт: <span id="score">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- ЭКРАН GAME OVER -->
        <div id="gameOverScreen" class="overlay hidden">
            <h2>Игра окончена</h2>
            <p>Ваш счёт: <span id="finalScore">0</span></p>
            <div class="game-over-buttons">
                <button id="restartBtn" class="btn-green">Начать заново</button>
                <button id="changeModeBtn" class="btn-gray">Сменить режим</button>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
